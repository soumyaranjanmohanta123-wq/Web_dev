<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <header>

        <h1 align="center">HTML FORM</h1>
        <hr>
    </header>
    <main>
        <section style="margin: 20px; background-color: beige;">

            <!-- action: destination url, method : get/post -->
            <form action="" method="">
                <div style="margin: 5px;">
                <label for="name">Name: </label>
                <input type="text" id="name">
                <!-- for and id is used to link the label with the input textbox -->
            </div>
            <div style="margin: 5px;">
                <label for="surnname">Surname: </label>
                <input type="text" id="surname">
            </div>
            <div style="margin: 5px;">
                <label for="age">Age: </label>
                <input type="text" id="age">
            </div>
            <div style="margin: 5px;">
                <label for="phone">Mobile No: </label>
                <input type="text" id="phone">
            </div>
             </form>
        </section>
        <section style="background-color: bisque;">
            <form action="">
                <fieldset>
                    <!-- fieldset is used as a container for the form tables -->
                    <label for="name2">Name:</label>
                    <input type="text" id="name2">
                    <br>
                    <label for="password">Password:</label>
                    <input type="password" id="password">
                    <br>
                    <label for="color"></label>
                    <input type="color" id="color">
                    <br>
                    <label for="email">Email:</label>
                    <input type="email" id="email">
                    <br>
                    <input type="date">
                    <br>
                    <input type="datetime">
                    <!-- we can input the date as well as time  in text box -->
                    <br>
                    <input type="datetime-local">
                    <!-- it will take the local device time -->
                    <br>
                    <input type="file">
                    <!-- used to upload file (any type of file)-->
                    <br>
                    <input type="image">
                    <!-- this is for the image -->
                    <br>
                    <input type="number">
                    <br>
                    <input type="tel">
                    <br>
                    <input type="week" name="" id="">
                    <br>
                    <input type="month">
                    <br>
                    <input type="year">
                    <br>
                    <input type="hidden">
                    <br>
                    <input type="submit">
                </fieldset>
                <input type="submit">
                <input type="reset">
                <!-- these inputs are create button -->
            </form>
        </section>
    </main>
<!-- homework spacex website -->
</body>
</html>
