<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Tags in HTML</title>
</head>
<body>
    <!-- Formatting Tags -->
     <h2 align="center">Formatting Tags</h2><hr>
     <b>Bold tag</b><br>
     <strong>Strong tag</strong><br>
     <!-- strong and bold perform same but strong is seo friendly -->

     <i>Italic</i><br>
     <em>Emphesis</em><br>
     <!-- both the tags are works same but em is seo friendly -->

     <u>Underlined</u><br>
     <ins>inserted</ins><br>
     <!-- both have same work but ins is seo friendly -->

     <s>Strike</s><br>
     <strike>Strike</strike><br>
     <del>Deleted text</del><br>
     <!-- all of these perorm same but del is seo friendly --> 

     <big>Big text</big><br>
     <!-- depricated tag: these srae nor seo friendly -->
     <small>Small text</small><br>
     <!-- These tags used to increse or decrease the tag sizes -->

     a<sup>2</sup><br>
     <!-- used for superscript -->

     H<sub>2</sub>O <br>
     <!-- Used for subscript -->

     <mark>soumya ranjan mohanta</mark><br>
     <!-- used to highlight the texts -->

     <code>printf("Soumya Ranjan Mohanta")</code><br>
     <!-- this tag print the texts as it is but this used for seo purposes so that the browser or the search engine diferentiate between the normal text and the codes -->

     <tt>soumya ranjan mohanta</tt><br>
     <!-- monotext -->

     <q>soumya</q><br><br>
     <!-- q tag is ised to the quote -->
     <blockquote>soumya</blockquote><br>
      <!-- it starts on a new line and takes up the full width available, and browsers automatically apply default indentation -->

     <abbr title="">HTML</abbr><br>
     <kbd>ctrl+c</kbd><br>
     <!-- kbd : keyboard input -->

     <var>y</var><br>
     <!-- v: tag is used for variable -->


</body>
</html>
