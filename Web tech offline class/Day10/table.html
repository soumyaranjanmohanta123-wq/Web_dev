<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <header align="center">
        <h1>TABLE</h1>
        <hr>
    </header>
    <main>
        <!-- cellpadding: space around the content of the cell -->
        <!-- cellspacing: space around the border of the cell  -->
        <table border="1" cellspacing="0" cellpadding="20px">
            <tr>
                <th>Name</th>
                <th>Roll No</th>
                <th>Sub</th>
            </tr>
            <tr>
                <td>Soumya Ranjan</td>
                <td>123456</td>
                <td rowspan="2">Python Full Stack</td>
            </tr>
            <tr>
                <td>Anand</td>
                <td>345678</td>
                <!-- <td>Python Full stack</td> -->
            </tr>
            <tr>
                <td>Subham</td>
                <td>234567</td>
                <td>Java Full Stack</td>
            </tr>
            <tr>
                <td>Abhinash</td>
                <td>567889</td>
                <td>Java Full Stack</td>
            </tr>
        </table>
    </main>
</body>
</html>
