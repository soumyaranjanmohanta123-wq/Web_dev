<!DOCTYPE html>

    <title>Table Practice</title>
</head>
<body>
    <header>
        <h1 align="center">Class Table Practice</h1>

            <tr>
                <!-- <th></th> -->
                <th>Height</th>
                <th>Width</th>
                <!-- <th></th> -->
            </tr>
            <tr>
                <td>Males</td>
                <td>1.9</td>
                <td>0.003</td>
                <td>40%</td>
            </tr>
            <tr>
                <td>Females</td>
                <td>1.7</td>
                <td>0.002</td>
                <td>43%</td>
            </tr>

        </table>
    </main>
</body>
</html>
