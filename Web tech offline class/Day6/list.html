<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1 align="center" style="color: rgb(103, 9, 24);">Lists</h1>
    <hr>
    <h2>Ordered list</h2>
    

    <!-- ol tag used for ordered list -->
     <!-- ordered list create a sequence of numbers -->
    <ol style="color: brown;" type="1" start="2" reversed>
        <!-- li tag is for the list items -->
        <li>Peoples(Friends)</li>
        <li>Place</li>
        <li>Accomodation</li>
        <li>Transort</li>
        <li>Budget</li>
        <li>Enjoyment,Photography</li>
        <li>Return</li>
    </ol>
    <!-- attributes of ordered list type : type,start,reversed -->
    <!-- type :A,a,1,I,i -->
    <!-- start : (where the list numbering starts) /it accepts only numeric values -->
     <!-- Starts : in html we can go upto 4 digit vaules/ thats the proramming standards -->
    <!-- reveresed(it will the reversed the list numbering) -->
     <hr>

    <h2>Unordered lists</h2>
    <!-- ul list have only one attribute type -->
    <ul type="circle">
        <!-- burret point and markers -->
        <li>Hii</li>
        <li>Hello</li>
        <li>How are you</li>
    </ul>
    <!-- type:disc(default),circle,square,none(no markers) -->
    
</body>
</html>
