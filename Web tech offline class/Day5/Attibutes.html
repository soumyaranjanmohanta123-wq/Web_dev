<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attributes</title>
</head>
<body>
    <h1 align="center" title="This is the heading of the page">Attributes</h1>
    <!-- title Attribute is used to add extra information about the content -->
    <hr>
    <h2>Types of Attributes</h2>
    <p>1.Core</p>
    <p>2.Generic</p>
    <p>3.internationalization</p>
    <p>4.global</p>
    <hr>

    <h2 title="This is the extrac inormaion about the h3 heading">Title</h2>

    <h2 style="color: pink;">Style</h2>
    <!-- style Attribute can be used in any tag of html and used for the inline css -->

    <h2 id="12345">ID</h2>
    <!-- id Attributeis used for the unique identification of the element -->
     <!-- we can use one id for one element -->
    
     <h2 class="subheading">CLASS</h2>
     <!-- class attributes is used to group of multiple element -->
      <!-- we can assign multiple elements to same class name to group them -->

      <!-- few generic attributes -->
    <!-- the class and id name should be a alphanumeric form -->
     <!-- hrf for hyperreference : it used in a -->
      <!-- src is used for source : it used in img, audio, video -->
       <!-- align is used to align text : left, right, center -->
        <!-- height, width :we can use this in block level element and also in few specific inline elements also :img,video -->
        
    <!-- internationalization attributes -->
     lang : language / it used in root tag (en,mr,)
     <!-- dir is used to write the direction of the text (rtf, ltr), it have default value ltr -->
      <h2  dir="rtl">Soumya Ranjan Mohanta</h2>
    
    <!-- global attributes -->
     <!-- these are used in all html element -->
     <!-- tabelement : focus on element, it allows us to manage out webpage without mouse -->
      <!-- =====in tabelement we can put a numeric value , the default value is 0 -->
       <!-- =====Interview Question : can we use the -ve value in tabelement(ans:yes but we need to use javascript) -->
       <!-- =====if we have lower value that have higher preference -->
        <!-- =====where to use : forms, -->
     <!-- accesskey : by this atributes we can create shortuts -->
      <!-- to uses this we have to press alt + key -->
       <!-- these are generally used in buttons,i/p, img -->
        <button accesskey="y">click here (alt+y)</button>
    <!-- dragabble="true/false" -->
     <!-- default value false -->
     <h2 draggable="true">Dragable element</h2>
    <!-- translate="yes/no" -->
     <p translate="no">Lorem ipsum dolor sit amet consectetur adipisicing elit. Accusantium, dignissimos.</p>
     <p translate="yes">Soumya Ranjan</p>
     <!-- it used to restrict the texts from translation -->


</body>
</html>
