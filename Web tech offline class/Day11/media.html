<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>
    <header>
        <h1 align="center">Media Tags in HTML</h1>
        <hr>
    </header>
    <main>
        <div style="border: 1px solid; margin: 10px; padding: 10px;">
            <img src="./image.jpg" alt="nature image" width="100%"" align="center">
            <!-- alt: if the image is not load then the alt msg will be visible -->
        </div>
        <div>
            <audio src="./Sukoon 2.0 _ Arijit Singh _ Salim Sulaiman _ Shraddha Pandit _ Anshuman Sharma _ Hindi Song 2026.mp3" controls loop muted autoplay></audio>

            <!-- attributes: -->
             <!-- control : it will shows the controls of the audio -->
              <!-- without the control attributes the audio is not visible -->
            <!-- loop : it will loop the audio -->
            <!-- muted : it will mute the attributes while opening the webpage -->
            <!-- autoplay : it will autoplay the audio when we opens the audio -->

        </div>
        <div style="border: 5px solid; margin: 10px; padding: 10px;" height="500px">
            <video src="./video.mp4" width="250px" controls autoplay loop></video>

            <!-- attributes -->
            <!-- controls : it shows the controls and it is required to play the videos -->
            <!-- loop: it plays the video in loop -->
            <!-- autoplay: it will autoplay the video when the webpage load -->
            <!-- muted : video muted from the starting of the webpage load -->
            <!-- width : set the width of the video -->
            <!-- height : set the height of the video -->
        </div>
        <div>
            <iframe src="https://www.youtube.com/embed/GX9x62kFsVU?si=zvaN9_bYEVzv_Pxu" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen width="500px" height="250px"></iframe>
        </div>
        <div style="margin: 10px; padding: 10px;">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3742.467446367086!2d85.7996984750307!3d20.28090981304438!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a1909d32fffffff%3A0xdc4d4bcad001a31f!2sQSpiders%20Bhubaneswar!5e0!3m2!1sen!2sin!4v1794034256106!5m2!1sen!2sin" width="100%" height="300px" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <!-- attributes: -->
            <!-- loading="lazy/eager" -->
             <!-- allowfullscreen -->
        </div>
    </main>
</body>
</html>
