<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* tag selector */
        /* p{
            background-color: red;
        } */

        /* decendent selector: it will select all children */
         /* div p{
            background-color: blue;
         } */

        /* child selector: it will secelect the direct childs()11st level child */
        #parent>p{
            background-color: aqua;
        }
        #nested>p{
            background-color: blue;
            color: white;
        }
        #nested2>p{
            background-color: beige;
            color:blue;
        }
        #parent{
            border: 2px solid black; 
        }

    </style>
</head>
<body>
    <p>Lorem ipsum dolor sit amet.</p>
    <h1>Lorem, ipsum dolor.</h1>
    <div id="parent">
        <p>Lorem ipsum dolor sit amet.</p>
        <span>Lorem, ipsum dolor.</span>
        <p>Lorem ipsum dolor sit amet consectetur.</p>

        <!-- 1st nested div -->
        <div id="nested">
            <p>nested div.</p>
            <h3>Lorem, ipsum dolor.</h3>

            <!-- 2nd nested div -->
            <div id="nested2">
                <p>Lorem ipsum dolor sit amet consectetur.</p>
            </div>
        </div>
    </div>
</body>
</html>
