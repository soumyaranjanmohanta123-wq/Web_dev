<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* id sector */
        #parent{
            border: 2px solid black; 
        }

        /* tag selector */
        /* p{

        /* decendent selector: it will select all children */
         /* div p{

         } */

        /* child selector: it will secelect the direct childs()11st level child */
        /* #parent>p{
            background-color: aqua;

        #nested>p{
            background-color: blue;

        /* adjacent selector: we can target the particular element which is next to the targeted element */
        /* it will secelect at most one element which is next to the targeted element */

        #nested > div + p{
            background-color: blue;
            color: white;
        }

        /* general sibling selector: it will select all the elements which are next to the targeted element */
        /* this is like the child selector but it will select all the elements which are next to the targeted element(n number of elements) */

        /* p ~ span{
            background-color: red;

        } */


    </style>
</head>
<body>
    <p>Lorem ipsum dolor sit amet.</p>
    <h1>Lorem, ipsum dolor.</h1>
    <div id="parent">
        <p>Lorem ipsum dolor sit amet.</p>
        <span>Lorem, ipsum dolor.</span>
        <p>Lorem ipsum dolor sit amet consectetur.</p>

        <!-- 1st nested div -->
        <div id="nested">
            <!-- 2nd nested div -->
            <div id="grandchild">
                <p>Lorem ipsum dolor sit amet consectetur.</p>
            </div>
            <p>nested div.</p>
            <h3>Lorem, ipsum dolor.</h3>
        </div>
    </div>
</body>
